name: tangan_kanan
description: "tangan kanan — On-demand home services platform."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend & Networking
  pocketbase: ^0.24.0
  http: ^1.2.2
  dio: ^5.4.3+1

  # State Management & Routing
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  go_router: ^17.2.3
  get_it: ^9.2.1

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.0.0

  # Image & Location
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  latlong2: ^0.9.1

  # Maps
  flutter_map: ^7.0.2
  url_launcher: ^6.3.1

  # Payment & Notification
  midtrans_sdk: ^1.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # UI
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/